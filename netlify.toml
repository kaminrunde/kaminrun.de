[build]
  environment = { NODE_VERSION = "16.19.0" }
  command = "npm run build"
  publish = "./dist/"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "interest-cohort=()"

[[redirects]]
  from = "https://kaminrun-de.netlify.com/*"
  to = "https://kaminrun.de/:splat"
  status = 301
  force = true

 [[redirects]]
  from = "https://kaminrun.de/index.html"
  to = "https://kaminrun.de/"
  status = 301
  force = true

 [[redirects]]
  from = "https://kaminrun.de/privacy.html"
  to = "https://kaminrun.de/"
  status = 302
  force = true

[[redirects]]
  from = "/phingest/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  host = "eu-assets.i.posthog.com"
  status = 200
  force = true

[[redirects]]
  from = "/phingest/*"
  to = "https://eu.i.posthog.com/:splat"
  host = "eu.i.posthog.com"
  status = 200
  force = true